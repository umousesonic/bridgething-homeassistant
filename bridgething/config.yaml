name: Bridgething
version: "0.1.50"
slug: bridgething
description: >-
  Companion for a Spotify Car Thing running Bridgething. Brings up the USB
  network link, gives the device internet, and exposes the screen as a Home
  Assistant device. Sound stays on a media player you choose.
url: https://github.com/umousesonic/bridgething-homeassistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
host_dbus: true
usb: true
homeassistant_api: true
privileged:
  - NET_ADMIN
  - NET_RAW
map:
  - type: homeassistant_config
    read_only: false
    path: /config
discovery:
  - bridgething
options:
  source_entity: ""
schema:
  source_entity: str?
